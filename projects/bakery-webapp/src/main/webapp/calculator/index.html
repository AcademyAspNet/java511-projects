<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Калькулятор</title>
    </head>
    <body>
        <form action="handler.jsp" method="POST">
            <label for="firstNumber">Введите первое число:</label>
            <input id="firstNumber" type="number" name="firstNumber">
            <br>
            <label for="secondNumber">Введите второе число:</label>
            <input id="secondNumber" type="number" name="secondNumber" value="2" readonly>
            <br>
            <button type="submit">Сложить два числа</button>
            <br>
        </form>
    </body>
</html>
